<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5ed"><meta name="description" content="每日岛屿。让完成的小事长成海边的一座岛，在海浪与海鸥之间记录每一天。">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="每日岛屿">
  <title>每日岛屿 · 让行动成为风景</title>
  <link rel="icon" type="image/svg+xml" href="./icon-lighthouse.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-lighthouse-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./visual.css"><link rel="stylesheet" href="./journal.css"><link rel="stylesheet" href="./account.css"><script type="module" src="./app.js"></script>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}),{once:true});</script>
</head>
<body>
<div class="app-wrap">
  <header class="site-header">
    <a class="brand" href="./" aria-label="每日岛屿首页"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 24L20 15 36 24 20 33Z" fill="#93b38a"/><path d="M4 24L20 33 36 24V29L20 38 4 29Z" fill="#bdac8c"/><path d="M19 22V5L30 9 19 14" stroke="#44756c" stroke-width="2.5" fill="#c99c79"/></svg><span>每日岛屿<small>DAILY ISLAND</small></span></a>
    <nav class="main-nav" aria-label="主要导航"><button id="todayNav" class="nav-button active">今日岛屿</button><button id="historyNav" class="nav-button">岛屿手记 <span id="historyCount">0</span></button></nav>
    <div class="header-tools"><button id="accountButton" class="account-button" type="button" aria-label="账户" aria-haspopup="dialog" aria-controls="accountDialog"><span>账户</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"/></svg></button><button id="lightButton" class="icon-button" aria-label="光照设置" title="光照设置" aria-expanded="false" aria-controls="lightPanel"></button><button id="helpButton" class="icon-button" aria-label="玩法说明" title="玩法说明"></button>
      <section id="lightPanel" class="light-popover" role="region" aria-labelledby="lightTitle" hidden>
        <div class="light-title-row"><div><p class="panel-eyebrow">A LITTLE SUNSHINE</p><h2 id="lightTitle">留住喜欢的光</h2></div><button id="lightClose" class="icon-button" aria-label="关闭光照设置">×</button></div>
        <div class="light-readout"><strong id="lightTime">12:00</strong><span id="lightModeLabel">跟随设备时间</span></div>
        <svg id="sunArc" viewBox="0 0 320 160" role="slider" tabindex="0" aria-label="拖动太阳调整光照时间" aria-valuemin="0" aria-valuemax="24" aria-valuenow="12" aria-describedby="lightHint">
          <defs><linearGradient id="sunPathColor"><stop stop-color="#7695a3"/><stop offset=".25" stop-color="#e4b773"/><stop offset=".5" stop-color="#f0ce86"/><stop offset=".75" stop-color="#d59172"/><stop offset="1" stop-color="#5d7a91"/></linearGradient></defs>
          <path class="sun-horizon" d="M18 130H302"/><path class="sun-orbit" d="M28 130A132 108 0 0 1 292 130"/>
          <path class="sun-ticks" d="M67 54l7 7M160 14v8M246 61l7-7"/>
          <text x="28" y="152" text-anchor="middle">00:00</text><text x="160" y="152" text-anchor="middle">12:00</text><text x="292" y="152" text-anchor="middle">24:00</text>
          <g id="sunHandle" transform="translate(160 22)"><circle r="23" fill="#e9b85c" opacity=".12"/><circle class="sun-disc" r="12"/><path class="sun-rays" d="M0-19v3M0 16v3M-19 0h3M16 0h3M-13-13l2 2M11 11l2 2M-13 13l2-2M11-11l2-2"/><path class="sun-moon" d="M3-10A11 11 0 1 0 10 7 11 11 0 0 1 3-10Z"/></g>
        </svg>
        <p id="lightHint" class="light-hint">沿弧线拖动太阳，岛上的光随之变化</p>
        <div class="light-presets"><button data-light-preset="morning">晨光</button><button data-light-preset="day">日间</button><button data-light-preset="evening">暮色</button><button data-light-preset="night">夜色</button></div>
        <button id="lightAuto" class="light-auto" aria-pressed="true">跟随设备时间</button><p class="light-safety-note">只改变光照，不改变日期和任务记录</p>
      </section>
    </div>
  </header>
  <main>
    <div class="page-heading" id="todayHeading"><div><p class="eyebrow" id="dateLabel"></p><h1 id="pageTitle" class="island-page-title">把今天，建成一座岛。</h1><p class="page-subtitle" id="pageSubtitle">每一件完成的小事，都让岛屿生长。</p></div><div class="daily-note"><span>ONE DAY, ONE ISLAND</span><p>慢慢来，每一小步都算数。</p></div></div>
    <div id="storageWarning" class="storage-warning" role="alert" hidden></div>
    <section class="journal-view" id="journalView" aria-label="岛屿手记" hidden></section>
    <section class="workspace" id="todayWorkspace" aria-label="每日岛屿工作台">
      <section class="island-scene" id="scene" data-light="day" aria-label="你的岛屿">
        <div class="scene-top"><div class="theme-badge" id="themeBadge"></div><div class="scene-date" id="sceneDate"></div></div>
        <div class="map-host" id="mapHost"></div>
        <div class="scene-empty" id="sceneEmpty"><span>一切，从一个小小的计划开始。</span></div>
        <div id="tileDetail" class="tile-detail" role="dialog" aria-modal="false" aria-labelledby="tileDetailTitle" hidden></div>
        <div class="scene-bottom"><span class="explore-status" id="exploreStatus"></span><button class="text-button" id="mapHelp">探索说明 <span>↗</span></button></div>
      </section>
      <aside class="task-panel" aria-label="任务规划"><div id="panelContent"></div></aside>
    </section>
    <footer class="page-footer"><span role="status" aria-live="polite"><i class="saved-dot"></i><span id="saveStatus">已保存在此浏览器</span></span><span>一件重要的事，一片属于你的风景。</span><div class="footer-actions"><button id="debugReset" class="text-button debug-reset">调试：清空记录</button><button id="privacyInfo" class="text-button">本地保存说明</button></div></footer>
  </main>
</div>
<dialog id="modal" aria-labelledby="modalTitle"><div id="modalContent"></div></dialog>
<dialog id="accountDialog" class="account-dialog" aria-labelledby="accountTitle">
  <button id="accountClose" class="account-close" type="button" aria-label="关闭账户窗口">×</button>
  <p class="account-eyebrow">YOUR LITTLE ISLAND</p><h2 id="accountTitle">留一盏归来的灯</h2>
  <p class="account-intro">现在可以继续作为访客使用。你的岛屿仍会自动保存在这个浏览器。</p>
  <div class="account-tabs" role="tablist" aria-label="账户操作"><button id="accountSignInTab" type="button" role="tab" aria-selected="true" aria-controls="accountForm">登录</button><button id="accountSignUpTab" type="button" role="tab" aria-selected="false" aria-controls="accountForm">注册</button></div>
  <form id="accountForm"><label for="accountUsername">用户名</label><input id="accountUsername" name="username" type="text" autocomplete="username" maxlength="40" required><label for="accountPassword">密码</label><input id="accountPassword" name="password" type="password" autocomplete="current-password" minlength="8" required><button id="accountSubmit" type="submit">登录</button></form>
  <p id="accountMessage" class="account-message" role="status" aria-live="polite">账户服务待连接；此处不会创建或验证账号。</p>
  <p id="accountSyncStatus" class="account-sync-status">本地记录：待传输</p>
  <button id="accountGuest" class="account-guest" type="button">继续作为访客</button>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><div class="noscript">请启用 JavaScript 以规划任务和探索岛屿。</div></noscript>
</body></html>
